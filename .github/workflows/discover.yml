name: Discover (temporary)
on:
  push:
    branches: [discovery]
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Real-site dry run (throwaway topic, no test ping)
        env:
          NTFY_TOPIC: throwaway-dryrun-${{ github.run_id }}
          STATE_FILE: /tmp/state.json
        run: |
          python check_nueplex_cinepax.py
          echo "--- state ---"; cat /tmp/state.json
